# Semi-attended preseed: the installer still asks for language,
# keyboard, hostname, user account, timezone, and target disk. Everything
# else is automated. SYNC: keep the automated set in step with
# preseed-auto.cfg — which presets the hostname, since --auto cannot prompt.

d-i netcfg/choose_interface select auto
# get_hostname is intentionally not preset, so d-i requires the user to
# enter a hostname. get_domain is preset empty so only hostname is asked.
d-i netcfg/get_domain string

# No root password: disable the root account and give the interactively
# created user account sudo access (Mint/Ubuntu style). The user account is
# still asked for; only the root-password step is skipped.
d-i passwd/root-login boolean false

# Mint-origin packages are not on DVD-1; a network mirror is required
# for them (setup.sh degrades gracefully without one).
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/use_mirror boolean true

tasksel tasksel/first multiselect standard, mate-desktop
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true

d-i preseed/late_command string cp -r /minty /target/opt/minty; in-target /bin/bash /opt/minty/setup.sh
