# Debian's /usr/share/lightdm/lightdm.conf.d/01_debian.conf sets
# greeter-hide-users=true (privacy default: manual username entry). This
# file lives in /etc, read after /usr/share, so it wins — show the user
# list, the Mint-like default. greeter-session is also set by slick-greeter's
# own 50-slick-greeter.conf; repeated here to keep the seat config in one place.
[Seat:*]
greeter-session=slick-greeter
greeter-hide-users=false
